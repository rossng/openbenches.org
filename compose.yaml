# Runs OpenBenches locally on http://localhost:8000 with the sample database.
#   docker compose up --build --wait
# Third-party API keys are dummies (dev/env.local), so maps, OCR, geocoding and login won't work.
name: openbenches

services:
  db:
    image: mariadb:11.4
    environment:
      MARIADB_ROOT_PASSWORD: root
      MARIADB_DATABASE: openbenc_benches
      MARIADB_USER: openbenches
      MARIADB_PASSWORD: badpassword
    volumes:
      - ./database:/seed:ro
      - ./dev/load-db.sh:/docker-entrypoint-initdb.d/00-load-db.sh:ro
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 120s

  web:
    build:
      context: ./www
      dockerfile: ../dev/Dockerfile
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:80"
    volumes:
      - ./dev/env.local:/var/www/openbenches/.env.local:ro
      - ./dev/symfony/framework.yaml:/var/www/openbenches/config/packages/framework.yaml:ro
      - ./dev/symfony/twig.yaml:/var/www/openbenches/config/packages/twig.yaml:ro
      - ./dev/symfony/doctrine.yaml:/var/www/openbenches/config/packages/doctrine.yaml:ro
      - photos:/var/www/openbenches/public/photos
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost/api/tags/"]
      interval: 5s
      timeout: 10s
      retries: 30

volumes:
  db-data:
  photos:
